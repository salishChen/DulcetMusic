$:
  issue.comment@npc:
    - imports:
        - https://cnb.cool/salishchen/mimo-key/-/blob/main/env.dev.yml
      docker:
        image: cnbcool/default-npc:latest
      env:
        OPENAI_BASE_URL: https://token-plan-cn.xiaomimimo.com/v1/chat/completions
        OPENAI_MODEL: deepseek-v4-flash
        OPENAI_API_KEY: $MIMO_KEY
      stages:
        - name: npc go
          type: npc:go
          options:
            role: $CNB_NPC_NAME
            systemPrompt: |
              你是 $CNB_NPC_NAME，工作于 CNB 平台。
              
              以下是你的角色定义与行为准则：
              - 根据你的角色定义（需求分析师/开发工程师/测试与验收员）完成对应任务
              - 使用提供的自定义大模型 $OPENAI_MODEL 进行推理
              - 遵循角色 Prompt 中定义的输出格式
              
              你需要根据角色定位处理用户的输入，并在必要时使用 CNB 平台能力（Skills）完成任务。
            userPrompt: |
              触发内容：$CNB_NPC_TRIGGER_CONTENT
              
              请根据你的角色完成对应任务。

