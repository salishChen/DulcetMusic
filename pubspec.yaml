name: flute_example
description: A Flutter music player example.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  on_audio_query: ^2.9.0
  audioplayers: ^6.8.1
  sqflite: ^2.4.1
  path: ^1.9.0
  path_provider: ^2.1.4
  audio_metadata_reader: ^1.6.0
  file_picker: ^8.1.2
  shared_preferences: ^2.2.0
  audio_service: ^0.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter


# For information on the generic Dart part of this file, see the
# following page: https://www.dartlang.org/tools/pub
# This file does not document the precise locations of Android/ios config;
# see the Flutter docs for the rest of the file.

flutter:
  # 启用 Material Design 图标字体，否则 Icons.xxx 将无法渲染
  uses-material-design: true
  # To add assets to your application, add an assets section, like this:
  assets:
   - assets/lady.jpeg
   - assets/music_record.jpeg
